<div id="bridge-wrapper">
	<button id="load_more_btn" style="background:none; border:none; cursor:pointer;"></button>
</div>
<ul id="messages">
	<div id="emoji-reaction" style="display:none; position:fixed; z-index:1000; background:white; padding:5px; border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.2);">
		<span onclick="sendReaction('👍')">👍</span>
		<span onclick="sendReaction('❤️')">❤️</span>
		<span onclick="sendReaction('😂')">😂</span>
		<span onclick="sendReaction('😮')">😮</span>
	</div>
</ul>
<div id="typing-indicator"></div>
<footer id ="bridge-footer">
	<form id="bridge-form">
		<label for="file-input" style="cursor:pointer; font-size: 1.5em; padding: 5px; margin: 5px;">📎</label>
		<!-- <button type="button" id="emoji-btn">😀</button> -->
		<button type="button" id="voice-btn">🎤</button>
		<input type="file" id="file-input" accept="image/*" style="display:none;">
		<div id="recording-status" style="display:none; color:red; font-size:0.8em; margin: 5px;">
			... <span id="timer">0s</span>
		</div>
		<textarea id="input_placeholder" placeholder="..." rows="1"></textarea>
		<button id="send_btn" type="submit">Envoyer</button>
	</form>
</footer>
